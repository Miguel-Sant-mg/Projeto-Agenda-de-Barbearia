{% extends "base.html" %}

{% block title %}Acesso do Barbeiro - {{ barbearia_nome }}{% endblock %}

{% block content %}
<div class="container">
  <div class="login-box-wrapper">
    <div class="booking-card" style="padding: 36px 30px;">
      
      <div style="text-align: center; margin-bottom: 26px;">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: rgba(245, 158, 11, 0.15); border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; margin: 0 auto 14px;">
          🔐
        </div>
        <h2 style="font-size: 1.6rem; margin-bottom: 6px;">Painel Administrativo</h2>
        <p style="color: var(--text-muted); font-size: 0.88rem;">Área exclusiva para barbeiros e gerência.</p>
      </div>

      <form action="{{ url_for('login_view') }}" method="POST">
        <div class="form-group">
          <label for="adminNome">Usuário</label>
          <input type="text" id="adminNome" name="nome" value="{{ nome or '' }}" class="form-control" placeholder="Seu nome de usuário" required autofocus autocomplete="username" autocapitalize="none" autocorrect="off" enterkeyhint="next">
        </div>

        <div class="form-group">
          <label for="adminSenha">Senha</label>
          <input type="password" id="adminSenha" name="senha" class="form-control" placeholder="••••••••" required autocomplete="current-password" enterkeyhint="go">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; min-height: 48px; font-size: 1rem;">
          Entrar no Painel &rarr;
        </button>
      </form>

      <div style="margin-top: 24px; padding: 12px; background: rgba(255, 255, 255, 0.03); border: 1px dashed var(--border); border-radius: var(--radius-sm); text-align: center; font-size: 0.8rem; color: var(--text-dark);">
        <p>Acesso padrão inicial:</p>
        <p><strong>Usuário:</strong> admin | <strong>Senha:</strong> admin123</p>
      </div>

      <div style="text-align: center; margin-top: 20px;">
        <a href="{{ url_for('index') }}" style="color: var(--text-muted); font-size: 0.86rem; text-decoration: underline;">
          &larr; Voltar para a Área de Agendamento
        </a>
      </div>

    </div>
  </div>
</div>
{% endblock %}
